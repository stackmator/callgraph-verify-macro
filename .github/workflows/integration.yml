# Real-compiler integration tests.
#
# Builds the fixtures in `callgraph-verify/test-fixtures/` with genuine
# toolchains, then runs the verifier's test suite over that compiler output:
#
# * Windows: MSVC `cl`/`link` (x86) -> full `cargo test --workspace`
#   (includes the Rust `test-bin` i686 suite and the trybuild UI suite).
# * Ubuntu: `i686-w64-mingw32-gcc`/`g++` cross-compile C/C++ to 32-bit PE,
#   Open Watcom (`owcc -bdos4g`) builds the DOS4GW LE fixture -> the
#   host-independent suites (`c_cpp_integration`, `dos_le_integration`,
#   `perf`, macro tests). The `test-bin`-backed `integration` suite needs
#   the MSVC linker, so it only runs on Windows.
#
# DOS scope: LE fixup tables are absorbed for post-fixup address facts
# (see `pe.rs`), but jump-table entry reads stay pre-fixup bytes, so most
# LE tests pin call-graph/CFG facts — absolute globals/vtables/IAT only
# via the post-image accept-set (`dos_fixup_post_images_accepted`).
#
# `CALLGRAPH_REQUIRE_FIXTURES=1` turns a missing fixture into a hard test
# failure: a broken build step must never silently green the suite by
# skipping every fixture test.

name: integration

on:
  push:
  pull_request:

env:
  CALLGRAPH_REQUIRE_FIXTURES: "1"

jobs:
  integration-windows:
    name: windows (MSVC fixtures + full suite)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC x86 environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) {
            throw 'Visual Studio with the x86 C++ toolset was not found'
          }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$devcmd`" -arch=x86 -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -ieq 'PATH') {
                Add-Content -Path $env:GITHUB_PATH -Value $value
              } else {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Build C/C++/DOS fixtures to 32-bit binaries
        run: python callgraph-verify/test-fixtures/build_fixtures.py --out target/fixtures

      - name: Assert all fixture artifacts exist
        run: |
          Get-ChildItem target/fixtures/
          foreach ($f in @('c_callgraph.exe', 'c_callgraph_addrs.json', 'c_callgraph_od.exe', 'c_callgraph_od_addrs.json', 'c_callgraph_dbg.exe', 'c_callgraph_dbg_addrs.json', 'cpp_callgraph.exe', 'cpp_callgraph_addrs.json')) { if (!(Test-Path "target/fixtures/$f")) { throw "missing $f" } }

      - name: Full test suite
        run: cargo test --workspace --verbose

  integration-ubuntu:
    name: ubuntu (MinGW + Watcom fixtures + host suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW-w64 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686

      - name: Set up Open Watcom (DOS4GW LE fixture)
        uses: open-watcom/setup-watcom@v1
        with:
          version: "2.0"
          target: "dos"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cross-compile fixtures (PE via MinGW, LE via Watcom)
        run: python3 callgraph-verify/test-fixtures/build_fixtures.py --out target/fixtures

      - name: Assert all fixture artifacts exist
        run: |
          ls -la target/fixtures/
          test -f target/fixtures/c_callgraph.exe
          test -f target/fixtures/c_callgraph_addrs.json
          test -f target/fixtures/c_callgraph_od.exe
          test -f target/fixtures/c_callgraph_od_addrs.json
          test -f target/fixtures/cpp_callgraph.exe
          test -f target/fixtures/cpp_callgraph_addrs.json
          test -f target/fixtures/dos_callgraph.exe
          # No c_callgraph_dbg.* here: ILT incremental linking is MSVC-only,
          # so the thunk tests skip on MinGW (see c_dbg_fixture).

      - name: C/C++ fixture integration tests
        run: cargo test -p callgraph-verify --test c_cpp_integration --verbose

      - name: DOS4GW LE fixture integration tests
        run: cargo test -p callgraph-verify --test dos_le_integration --verbose

      - name: Perf regression tests (synthetic PEs, host-only)
        run: cargo test -p callgraph-verify --test perf --verbose

      - name: Macro unit + trybuild UI tests (host-only)
        run: cargo test -p callgraph-verify-macro --verbose
