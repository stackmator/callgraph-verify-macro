# callgraph-verify-macro — the pure-byte call-graph check AS A FUNCTION ATTRIBUTE.
#
#   #[callgraph_verify(0x004028d0, calls = [0x00401f00, 0x00401f20], fields = [0x4, 0x6])]
#   pub unsafe fn set(..) { .. }
#
# The macro disassembles the target binary at compile time and emits `compile_error!`
# on any mismatch, so `cargo build`/`cargo check` FAILS on a hallucination — no
# separate test or build script. Proc-macros always build for the host, so the
# iced-x86 dependency never touches the rebuild's i686 target binary.
[package]
name = "callgraph-verify-macro"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
callgraph-verify = { path = "../callgraph-verify" }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# End-to-end compile-error fixtures under tests/ui/. Each fixture file is a
# small Rust source file with an `#[origin]` (or `vtable_table!`) that should
# fail with a specific CG-VERIFY-Exxx error; the matching .stderr snapshot
# pins the exact rendered message. Adding a new error code without a fixture
# is a regression: the test runner will silently keep working, but the
# wording can drift undetected. see tests/error_codes.rs.
trybuild = "1.0"