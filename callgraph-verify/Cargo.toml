# callgraph-verify — anti-hallucination call-graph gate, sourced PURELY from the
# real binary's bytes. Unlike tools/analysis/verify_callgraph.py,
# this never reads Ghidra .asm exports or decompiled .c: it parses the PE and
# disassembles the actual machine code with iced-x86, so it cannot inherit a
# decompiler's mistakes (truncated/split functions, misnamed targets).
#
# Lives in the rebuild workspace as a proc-macro build dependency — Cargo always
# compiles proc-macro crates and their dependencies for the HOST (x86_64), so
# iced-x86 never enters the i686 target binary.
[package]
name = "callgraph-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-byte x86 call-graph verifier for reverse-engineering rebuilds — disassembles the target PE/LE at build time, no decompiler input"
documentation = "https://docs.rs/callgraph-verify"
readme = "../README.md"
keywords = ["reverse-engineering", "disassembly", "verification", "x86", "call-graph"]
categories = ["development-tools"]
exclude = ["test-bin/"]

[lib]
name = "callgraph_verify"
path = "src/lib.rs"

[[bin]]
name = "callgraph_verify"
path = "src/main.rs"

[dependencies]
# Pure-Rust x86/x64 decoder (no C deps). Decode-only feature set keeps it lean.
# `nasm` adds the formatter used by the reference-skeleton emitter (host-only build dep).
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info", "nasm"] }

[dev-dependencies]
# Only used by tests/c_cpp_integration.rs to read the address manifests that
# test-fixtures/build_fixtures.py writes (never linked into the library/CLI).
serde_json = "1"

